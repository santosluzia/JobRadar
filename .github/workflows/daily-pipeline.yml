name: Pipeline diário

# Quatro execuções por dia, uma a cada 6 horas, disparadas pelo cron-job.org via API
# (workflow_dispatch com origem=agendador); veja docs/operations.md. Com o fuso da tarefa em
# America/Sao_Paulo os disparos são 00:00, 06:00, 12:00 e 18:00 (UTC-3, sem horário de verão
# desde 2019). O cron do próprio GitHub fica só de reserva: ele não garante o horário e costuma
# atrasar horas (em 17/10/2026 a execução das 06:47 só começou às 10:12).
# Reservas: 03:13, 09:13, 15:13 e 21:13 UTC = 00:13, 06:13, 12:13 e 18:13 em São Paulo.
# O job "checar" deixa rodar só a primeira execução agendada de cada turno de 6 horas: se já
# houve uma com sucesso no mesmo turno, as outras terminam em segundos, sem coletar nem mandar
# e-mail. Se a do cron-job.org falhar ou não chegar, a reserva do GitHub roda quando sair da fila.
on:
  schedule:
    - cron: "13 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      notificar:
        description: "Enviar e-mail ao final"
        type: boolean
        default: true
      origem:
        description: "manual roda sempre; agendador (usado pelo cron-job.org) conta como a execução do turno"
        type: choice
        options: [manual, agendador]
        default: manual

# O job "checar" reconhece as execuções agendadas pelo título.
run-name: ${{ github.event_name == 'schedule' && 'Agendado (reserva GitHub)' || (inputs.origem == 'agendador' && 'Agendado (cron-job.org)' || 'Manual') }}

# Permissão mínima: o GITHUB_TOKEN só escreve NESTE repositório (branch public-data) e lê a
# lista de execuções deste workflow (job "checar"). O histórico privado é acessado por uma
# deploy key restrita ao repositório jobradar-data.
permissions:
  contents: write
  actions: read

concurrency:
  group: jobradar-pipeline
  cancel-in-progress: false

env:
  JOBRADAR_LAKE: ${{ github.workspace }}/lake
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  DATA_REPO: ${{ vars.JOBRADAR_DATA_REPO || format('{0}-data', github.repository) }}

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.turno.outputs.rodar }}
      pular_vazio: ${{ steps.turno.outputs.pular_vazio }}
    steps:
      - name: Já rodou neste turno?
        id: turno
        env:
          GH_TOKEN: ${{ github.token }}
          AGENDADA: ${{ github.event_name == 'schedule' || inputs.origem == 'agendador' }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          # Turnos de 6 horas pelo horário de criação da execução em São Paulo, com os limites 30 min
          # antes da hora cheia: madrugada 23:30–05:29, manhã 05:30–11:29, tarde 11:30–17:29,
          # noite 17:30–23:29. Disparos na hora cheia (00, 06, 12, 18 em SP, ou 21, 03, 09, 15 se
          # a tarefa estiver em UTC) caem sempre um em cada turno, longe dos limites.
          adiantado() { echo $(( $(date -d "$1" +%s) + 1800 )); }
          turno_de() {
            case $(( 10#$(TZ=America/Sao_Paulo date -d "@$(adiantado "$1")" +%H) / 6 )) in
              0) echo madrugada ;; 1) echo manha ;; 2) echo tarde ;; *) echo noite ;;
            esac
          }
          dia_de() { TZ=America/Sao_Paulo date -d "@$(adiantado "$1")" +%F; }

          criada=$(gh api "repos/$REPO/actions/runs/$RUN" --jq .created_at)
          dia=$(dia_de "$criada"); turno=$(turno_de "$criada")
          echo "Execução de $dia, turno: $turno."

          # Execução manual (Run workflow) sempre roda, manda o e-mail mesmo vazio e não conta para o turno.
          if [ "$AGENDADA" != "true" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"; echo "pular_vazio=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Só a manhã manda e-mail sem vaga nova (alarme de coleta parada); os outros turnos só se houver vaga.
          [ "$turno" = manha ] && echo "pular_vazio=false" >> "$GITHUB_OUTPUT" || echo "pular_vazio=true" >> "$GITHUB_OUTPUT"

          # Execuções agendadas concluídas com sucesso (as que terminaram em segundos também contam:
          # só terminam assim se já havia outra com sucesso no mesmo turno).
          runs="repos/$REPO/actions/workflows/daily-pipeline.yml/runs?status=success&per_page=30"
          filtro='.workflow_runs[] | select(.event == "schedule" or (.display_title | startswith("Agendado"))) | .created_at'
          for outra in $(gh api "$runs" --jq "$filtro"); do
            if [ "$(dia_de "$outra")" = "$dia" ] && [ "$(turno_de "$outra")" = "$turno" ]; then
              echo "Já houve execução agendada com sucesso neste turno ($outra UTC); esta não roda."
              echo "rodar=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Nenhuma execução agendada com sucesso neste turno; rodando."
          echo "rodar=true" >> "$GITHUB_OUTPUT"

  pipeline:
    needs: checar
    if: needs.checar.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[app,dev]"

      - name: Testes
        run: pytest -q

      - name: Baixar histórico (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.JOBRADAR_DATA_DEPLOY_KEY }}
          path: lake
          fetch-depth: 1

      - name: Coletar e transformar
        id: run
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: jobradar run --run-id "$RUN_ID" --report run-report.json

      # Roda mesmo se todas as fontes falharam (status=falha), para registrar a execução;
      # não roda se o processo quebrou no meio (aí não há status e o lake não é confiável).
      - name: Persistir histórico
        if: always() && steps.run.outputs.status != ''
        run: bash scripts/persist_lake.sh "execução ${RUN_ID} (${{ steps.run.outputs.status }})"

      - name: Gerar e validar contrato público
        run: jobradar publish --out public_out --run-id "$RUN_ID"

      - name: Publicar dados públicos (branch public-data)
        run: bash scripts/publish_public_data.sh public_out public-data

      - name: Enviar e-mail
        if: github.event_name == 'schedule' || inputs.notificar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: jobradar notify --run-id "$RUN_ID" ${{ needs.checar.outputs.pular_vazio == 'true' && '--pular-se-vazio' || '' }}

      - name: Persistir registro de notificações
        if: github.event_name == 'schedule' || inputs.notificar
        run: bash scripts/persist_lake.sh "notificações ${RUN_ID}"

      - name: Métricas da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execucao-${{ env.RUN_ID }}
          path: run-report.json
          retention-days: 14
          if-no-files-found: ignore
