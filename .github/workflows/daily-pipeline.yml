name: Pipeline diário

# Cron do GitHub Actions é sempre UTC; São Paulo é UTC-3 (sem horário de verão desde 2019).
# O GitHub não garante o horário: a execução agendada pode atrasar horas ou nem acontecer
# (em 17/10/2026 a das 06:47 só começou às 10:12). Por isso há três horários:
#   09:47 UTC = 06:47 SP (principal) · 12:17 UTC = 09:17 SP · 15:37 UTC = 12:37 SP (reservas).
# O job "checar" deixa só a primeira execução agendada do dia rodar: se já houve uma com
# sucesso hoje (dia de São Paulo), as reservas terminam em segundos, sem coletar nem mandar
# e-mail. Se a principal falhar, a reserva seguinte tenta de novo. Minutos "quebrados" de
# propósito: a hora cheia é o horário mais congestionado da fila do GitHub.
on:
  schedule:
    - cron: "47 9 * * *"
    - cron: "17 12 * * *"
    - cron: "37 15 * * *"
  workflow_dispatch:
    inputs:
      notificar:
        description: "Enviar e-mail ao final"
        type: boolean
        default: true

# Permissão mínima: o GITHUB_TOKEN só escreve NESTE repositório (branch public-data) e lê a
# lista de execuções deste workflow (job "checar"). O histórico privado é acessado por uma
# deploy key restrita ao repositório jobradar-data.
permissions:
  contents: write
  actions: read

concurrency:
  group: jobradar-pipeline
  cancel-in-progress: false

env:
  JOBRADAR_LAKE: ${{ github.workspace }}/lake
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  DATA_REPO: ${{ vars.JOBRADAR_DATA_REPO || format('{0}-data', github.repository) }}

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.dia.outputs.rodar }}
    steps:
      - name: Já rodou hoje?
        id: dia
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          # Execução manual (Run workflow) sempre roda.
          if [ "$EVENTO" != "schedule" ]; then echo "rodar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hoje=$(TZ=America/Sao_Paulo date +%F)
          runs="repos/$REPO/actions/workflows/daily-pipeline.yml/runs?event=schedule&status=success&per_page=10"
          for criada in $(gh api "$runs" --jq '.workflow_runs[].created_at'); do
            if [ "$(TZ=America/Sao_Paulo date -d "$criada" +%F)" = "$hoje" ]; then
              echo "Já houve execução agendada com sucesso hoje ($criada UTC); esta reserva não roda."
              echo "rodar=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Nenhuma execução agendada com sucesso hoje ($hoje); rodando."
          echo "rodar=true" >> "$GITHUB_OUTPUT"

  pipeline:
    needs: checar
    if: needs.checar.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[app,dev]"

      - name: Testes
        run: pytest -q

      - name: Baixar histórico (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.JOBRADAR_DATA_DEPLOY_KEY }}
          path: lake
          fetch-depth: 1

      - name: Coletar e transformar
        id: run
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: jobradar run --run-id "$RUN_ID" --report run-report.json

      # Roda mesmo se todas as fontes falharam (status=falha), para registrar a execução;
      # não roda se o processo quebrou no meio (aí não há status e o lake não é confiável).
      - name: Persistir histórico
        if: always() && steps.run.outputs.status != ''
        run: bash scripts/persist_lake.sh "execução ${RUN_ID} (${{ steps.run.outputs.status }})"

      - name: Gerar e validar contrato público
        run: jobradar publish --out public_out --run-id "$RUN_ID"

      - name: Publicar dados públicos (branch public-data)
        run: bash scripts/publish_public_data.sh public_out public-data

      - name: Enviar e-mail
        if: github.event_name == 'schedule' || inputs.notificar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: jobradar notify --run-id "$RUN_ID"

      - name: Persistir registro de notificações
        if: github.event_name == 'schedule' || inputs.notificar
        run: bash scripts/persist_lake.sh "notificações ${RUN_ID}"

      - name: Métricas da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execucao-${{ env.RUN_ID }}
          path: run-report.json
          retention-days: 14
          if-no-files-found: ignore
