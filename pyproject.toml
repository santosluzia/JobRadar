[project]
name = "jobradar"
version = "1.0.0"
description = "JobRadar — Observatório de Mercado e Inteligência de Carreira em Engenharia de Dados"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luzia Santos" }]
dependencies = [
    "httpx>=0.27",          # coletores HTTP com timeout e retry
    "pydantic>=2.6",        # schema canônico e validação de registros
    "duckdb>=1.0",          # motor analítico (silver/gold em SQL)
    "pandas>=2.1",          # manipulação tabular entre camadas
    "pyarrow>=15",          # Parquet
    "pyyaml>=6.0",          # configuração legível
    "beautifulsoup4>=4.12", # HTML → texto nas descrições
    "jsonschema>=4.21",     # validação do contrato de dados antes de publicar
    "rfc3339-validator>=0.1", # faz o jsonschema checar o formato date-time
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "altair>=5"]
dev = ["pytest>=8"]

[project.scripts]
jobradar = "jobradar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobradar = ["publishing/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
