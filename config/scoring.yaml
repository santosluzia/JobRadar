# Pesos do score de aderência (0–100) e das recomendações de estudo.
# O score é uma medida de compatibilidade com o perfil — NÃO é probabilidade de contratação.
# Explicação de cada componente em docs/architecture.md, seção "Score de aderência".

aderencia:
  pesos:                       # somam 100
    familia: 20                # responsabilidade/cargo compatível com o objetivo
    competencias: 45           # requisitos e desejáveis cobertos por evidência
    senioridade: 20
    modalidade_local: 15
  familia:                     # fração do peso por família de cargo
    engenharia_dados: 1.0
    analytics_engineering: 0.9
    desenvolvimento_dados: 0.85
    governanca_qualidade: 0.75
    administracao_dados: 0.75
    analise_dados: 0.6
    outra: 0.0
  # Vaga de título genérico (analista, desenvolvedor, consultor, especialista…) sem família de dados no
  # título, mas que pede ao menos `min_competencias` destas competências: conta pelas responsabilidades,
  # com `fracao` do peso de família e SEM a penalidade familia_outra. A busca passa a valer pelas
  # competências, não só pelo título.
  familia_por_competencias:
    min_competencias: 3
    fracao: 0.5
    competencias: [sql, plsql, oracle, sql_server, postgres, mysql, nosql, tuning_bd, administracao_bd,
                   modelagem, etl, data_warehouse, data_lake, databricks, spark, processamento_distribuido,
                   airflow, dbt, data_factory, snowflake, kafka, qualidade_dados, governanca]
  evidencia:                   # quanto cada nível de evidência cobre um requisito
    profissional: 1.0
    projeto: 0.75
    em_desenvolvimento: 0.4
    nao_dominada: 0.0
    sem_evidencia: 0.0         # sem registro no perfil ≠ não saber; aparece separado nas lacunas
  peso_desejavel: 0.4          # desejável vale 40% de um requisito
  senioridade:                 # fração do peso por senioridade da vaga
    junior: 1.0
    pleno: 0.9
    nao_informada: 0.6
    estagio: 0.0
    senior: 0.2
    lideranca: 0.0
  penalidades:
    palavra_excludente: 30
    familia_outra: 20

recomendacoes:
  janela_dias: 90              # período recente
  janela_comparacao_dias: 90   # período anterior equivalente
  min_vagas_janela: 30         # abaixo disso a tendência não é considerada
  min_variacao_pp: 5           # variação mínima (pontos percentuais) para chamar de tendência
  limiar_lacuna_prioritaria: 0.15   # competência pedida em ≥15% das vagas-alvo
  pesos:
    demanda: 0.45
    requisito: 0.20
    tendencia: 0.15
    projeto: 0.10
    esforco: 0.10
  esforco_fator: {baixo: 1.0, medio: 0.6, alto: 0.3}

# Coocorrência de competências (analytics/coocorrencia.py, docs/adr/0002). Associação na amostra,
# não causa. Base = vagas com ao menos uma competência técnica; janela = recomendacoes.janela_dias.
# Etapa 8 (docs/privacidade.md): retenção dos dados pessoais na pasta privada local ($JOBRADAR_HOME).
# Roda a cada importação de currículo e com `jobradar privacidade limpar`.
privacidade:
  max_versoes_curriculo: 12   # versões mais antigas saem com o original e os diagnósticos delas
  meses_diagnosticos: 24      # diagnósticos do currículo e planos de evolução salvos

coocorrencia:
  min_vagas_par: 10        # abaixo disso o par é "amostra pequena" (não vai para o público)
  publicar_pares: 100      # quantos pares entram em skill-trends.json
  ordem_publica: jaccard   # jaccard equilibra frequência e associação; lift sozinho favorece pares raros

# Análise privada do currículo (Etapa 3, docs/adr/0003). O currículo NUNCA sai da sua máquina.
curriculo:
  # Quanto cada nível de evidência NO TEXTO DO CURRÍCULO cobre uma competência pedida.
  # Curso/certificação concluído é "parcial": não é experiência profissional.
  pesos_evidencia: {comprovada: 1.0, projeto: 0.75, declarada: 0.5, parcial: 0.4, sem_evidencia: 0.0}
  janela_dias: 90                 # vagas-alvo: primeira observação nos últimos N dias
  min_pct_relevante: 5            # competência pedida em menos de N% das vagas-alvo não entra nas listas
  limiar_lacuna_pct: 15           # pedida em ≥ N% das vagas-alvo e sem evidência → lacuna prioritária

# Minha Evolução Profissional (Etapa 4, docs/adr/0004). Prioridade = soma ponderada de 7 fatores (0–1).
evolucao:
  pesos:
    frequencia: 0.30        # % das vagas-alvo que pedem a competência
    exigencia: 0.15         # parte dessas vagas que a pede como REQUISITO
    crescimento: 0.10       # variação contra o período anterior (0 enquanto inconclusiva)
    compatibilidade: 0.15   # quanto é mais comum nas vagas do objetivo do que no resto do mercado
    senioridade: 0.10       # frequência nas vagas das senioridades do objetivo
    esforco: 0.10           # menor esforço estimado pesa mais (esforco_fator das recomendações)
    comprovacao: 0.10       # dá para demonstrar num projeto de portfólio
  max_prioritarias: 5       # NÃO recomenda todas as lacunas: só as N de maior prioridade…
  prioridade_minima: 0.25   # …e acima deste corte
  crescimento_pp_maximo: 20 # variação (p.p.) que vale 1,0 no fator crescimento
