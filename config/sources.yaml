# Fontes de coleta e filtros de relevância.
# Cada fonte pode ser ligada/desligada sem mexer no código.
# Situação de cada fonte está documentada em docs/architecture.md (seção "Fontes").

busca:
  termos:
    - engenheiro de dados
    - engenheira de dados
    - engenharia de dados
    - data engineer
    - analytics engineer
    - desenvolvedor de dados
    - analista de dados
    - governanca de dados
    - qualidade de dados
    - data quality
    - integracao de dados
    - etl
    - big data
    - databricks
    # Administração de dados / DBA (cada termo = 1 chamada Adzuna por execução; ver docs/operations.md)
    - banco de dados
    - dba
    - administrador de dados
    - database administrator
    - pl/sql
    - sql server
  max_dias_publicacao: 30      # vagas publicadas antes disso não entram como "novas"

fontes:
  gupy:
    ativo: true
    # Endpoint usado pelo portal público (portal.gupy.io), sem login.
    # NÃO é uma API documentada: pode mudar. A lista aceita URLs alternativas, testadas em ordem.
    # Em 2026-10 os antigos portal.api.gupy.io/api/v1/jobs e employability-portal.gupy.io/api/v1/jobs
    # passaram a responder 404; o portal migrou para a rota abaixo (mesmo formato data/pagination).
    urls:
      - https://portal.gupy.io/api/job-search/jobs
    # Páginas de 100. Em 2026-11-18, "analista de dados" tinha 191 vagas abertas e as 91 além da 1ª página
    # nunca entravam; 300 cobre todos os termos com folga (custo: +1 a 2 requisições por execução).
    limite_por_termo: 300
    pausa_segundos: 1.0
  adzuna:
    ativo: true                # só roda com ADZUNA_APP_ID e ADZUNA_APP_KEY
    pais: br                   # cobertura brasileira: validar na 1ª execução real
    resultados_por_pagina: 50
    max_dias: 30
    pausa_segundos: 1.0
    # Termos buscados só no TÍTULO (title_only); os demais, como expressão em título + descrição
    # (what_phrase). Sondagem de 2026-11-18, % das 50 vagas mais recentes com família de dados no título:
    # "banco de dados" 6% pela expressão × 62% pelo título; "sql server" 16% × 50%; "integracao de dados"
    # 12% × 67%. Nomes de cargo ("analista de dados", "data engineer", "dba") ficam com a expressão (82–91%).
    termos_so_no_titulo: [engenharia de dados, desenvolvedor de dados, governanca de dados, qualidade de dados,
                          data quality, integracao de dados, etl, big data, databricks, banco de dados,
                          administrador de dados, pl/sql, sql server]
  greenhouse:
    ativo: true                # API pública documentada, por empresa
    # As empresas vêm do catálogo config/empresas.yaml (ats: greenhouse, status: ativa).
    # `empresas: [...]` aqui ainda é aceito (somado ao catálogo), mas prefira o catálogo.
    titulo_contem: &titulo_dados [dados, data, analytics, bi, business intelligence, etl, elt,
                                  databricks, spark, dbt, sql, dba, dbre, database, oracle, postgres,
                                  postgresql, mysql]
    pausa_segundos: 0.5
  lever:
    ativo: true                # API pública documentada, por empresa
    # Empresas: catálogo config/empresas.yaml (ats: lever, status: ativa).
    titulo_contem: *titulo_dados
    pausa_segundos: 0.5
  ashby:
    ativo: true                # Public Job Posting API (sem autenticação), por empresa
    # Empresas: catálogo config/empresas.yaml (ats: ashby, status: ativa). Sem empresa ativa, não roda.
    titulo_contem: *titulo_dados
    pausa_segundos: 0.5
  smartrecruiters:
    ativo: true                # Posting API pública (vagas PUBLIC, sem autenticação), por empresa
    # Empresas: catálogo config/empresas.yaml (ats: smartrecruiters, status: ativa). Uma requisição por
    # página de 100 vagas + uma por vaga que passa no filtro de título (a descrição vem do detalhe).
    titulo_contem: *titulo_dados
    pausa_segundos: 0.5

# Filtros usados para decidir o que é "vaga relevante" (e-mail e jobs.json).
# Vagas fora do filtro continuam no histórico e entram nas análises de mercado.
filtros:
  familias: [engenharia_dados, analytics_engineering, desenvolvimento_dados, analise_dados, governanca_qualidade,
             administracao_dados]
  # Vaga de título genérico (analista, desenvolvedor, consultor…) que pede competências de dados suficientes
  # também é relevante, mesmo sem família de dados no título (regra em scoring.yaml → familia_por_competencias).
  incluir_por_competencias: true
  senioridades: [junior, pleno, nao_informada]
  modalidades: [remoto, hibrido, presencial, nao_informada]
  locais:                      # vale para híbrido/presencial; remoto passa sempre
    ufs: [SP]
    cidades: [sao paulo, osasco, barueri, santana de parnaiba, carapicuiba, cotia]
  tecnologias_interesse: [python, sql, plsql, oracle, databricks, spark, etl, data_lake, qualidade_dados, governanca,
                          tuning_bd]
  exigir_tecnologia_interesse: false   # true = só vagas que citem ao menos uma delas
  palavras_obrigatorias: []    # se preenchido, a vaga precisa conter ao menos uma
  palavras_excludentes: [estagio, estagiario, estagiaria, aprendiz, advogad]   # comparadas com o título; advogad = advogado(a)
  score_minimo: 45             # aderência mínima (0–100) para ir ao e-mail

notificacoes:
  # O e-mail de cada turno traz as vagas relevantes publicadas ontem e hoje (horário de São Paulo) ainda
  # não enviadas: a mesma regra do filtro "Ontem e hoje" da tela Vagas.
  cartoes: 10                  # as N de maior score ganham cartão completo; o resto vai em lista compacta
  incluir_atrasadas: true      # seção "encontradas agora, publicadas antes" (fonte atrasou / empresa nova)
  max_vagas: 130               # proteção: o Gmail corta e-mails acima de ~102 KB (130 vagas ≈ 92 KB); o excedente é avisado
  enviar_quando_vazio: true    # manda e-mail mesmo sem vagas novas (serve de alarme se a coleta parar)

# Etapa 8: alertas de saúde (jobradar saude; resumo do Actions e rodapé do Radar). Só agregados.
saude:
  horas_sem_sucesso: 14
  taxa_falha_7d_max_pct: 25
  duracao_max_s: 900
  cobertura_extracao_min_pct: 50   # % das vagas recentes da fonte com ao menos uma competência técnica
  cobertura_extracao_min_pct_por_fonte:
    adzuna: 25                     # a API entrega só um trecho da descrição (~40% com competência é o normal)
  invalidos_max_pct: 10
  falhas_seguidas_fonte: 3
  janela_extracao_dias: 30

retencao:
  bronze_dias: 90              # respostas brutas
  descricao_dias_apos_ultima_observacao: 180
  status_desconhecido_apos_dias: 14
