# Fontes de coleta e filtros de relevância.
# Cada fonte pode ser ligada/desligada sem mexer no código.
# Situação de cada fonte está documentada em docs/architecture.md (seção "Fontes").

busca:
  termos:
    - engenheiro de dados
    - engenheira de dados
    - engenharia de dados
    - data engineer
    - analytics engineer
    - desenvolvedor de dados
    - analista de dados
    - governanca de dados
    - qualidade de dados
  max_dias_publicacao: 30      # vagas publicadas antes disso não entram como "novas"

fontes:
  gupy:
    ativo: true
    # Endpoint usado pelo portal público (portal.gupy.io), sem login.
    # NÃO é uma API documentada: pode mudar. A lista aceita URLs alternativas, testadas em ordem.
    # Em 2026-10 os antigos portal.api.gupy.io/api/v1/jobs e employability-portal.gupy.io/api/v1/jobs
    # passaram a responder 404; o portal migrou para a rota abaixo (mesmo formato data/pagination).
    urls:
      - https://portal.gupy.io/api/job-search/jobs
    limite_por_termo: 100
    pausa_segundos: 1.0
  adzuna:
    ativo: true                # só roda com ADZUNA_APP_ID e ADZUNA_APP_KEY
    pais: br                   # cobertura brasileira: validar na 1ª execução real
    resultados_por_pagina: 50
    max_dias: 30
    pausa_segundos: 1.0
  greenhouse:
    ativo: true                # API pública documentada, por empresa
    # Tokens conferidos em 2026-10-17 (boards-api.greenhouse.io/v1/boards/<token>): empresas com
    # vagas no Brasil e ao menos uma vaga de dados na sondagem. Para incluir outra, confirme o token
    # em boards.greenhouse.io/<token>.
    empresas: [quintoandar, ebanx, wildlifestudios, vtex, c6bank, stone, rdstation, jusbrasil,
               xpinc, btgpactual, inter, agibank]
    titulo_contem: &titulo_dados [dados, data, analytics, bi, business intelligence, etl, elt,
                                  databricks, spark, dbt, sql]
    pausa_segundos: 0.5
  lever:
    ativo: true                # API pública documentada, por empresa
    empresas: [ciandt]         # confirme em jobs.lever.co/<empresa>
    titulo_contem: *titulo_dados
    pausa_segundos: 0.5

# Filtros usados para decidir o que é "vaga relevante" (e-mail e jobs.json).
# Vagas fora do filtro continuam no histórico e entram nas análises de mercado.
filtros:
  familias: [engenharia_dados, analytics_engineering, desenvolvimento_dados, analise_dados, governanca_qualidade]
  senioridades: [junior, pleno, nao_informada]
  modalidades: [remoto, hibrido, presencial, nao_informada]
  locais:                      # vale para híbrido/presencial; remoto passa sempre
    ufs: [SP]
    cidades: [sao paulo, osasco, barueri, santana de parnaiba, carapicuiba, cotia]
  tecnologias_interesse: [python, sql, spark, databricks, azure, airflow, dbt]
  exigir_tecnologia_interesse: false   # true = só vagas que citem ao menos uma delas
  palavras_obrigatorias: []    # se preenchido, a vaga precisa conter ao menos uma
  palavras_excludentes: [estagio, estagiario, estagiaria, aprendiz]
  score_minimo: 45             # aderência mínima (0–100) para ir ao e-mail

notificacoes:
  # O e-mail diário traz as vagas relevantes publicadas ontem e hoje (horário de São Paulo) ainda
  # não enviadas: a mesma regra do filtro "Ontem e hoje" da tela Vagas.
  cartoes: 10                  # as N de maior score ganham cartão completo; o resto vai em lista compacta
  incluir_atrasadas: true      # seção "encontradas agora, publicadas antes" (fonte atrasou / empresa nova)
  max_vagas: 130               # proteção: o Gmail corta e-mails acima de ~102 KB (130 vagas ≈ 92 KB); o excedente é avisado
  enviar_quando_vazio: true    # manda e-mail mesmo sem vagas novas (serve de alarme se a coleta parar)

retencao:
  bronze_dias: 90              # respostas brutas
  descricao_dias_apos_ultima_observacao: 180
  status_desconhecido_apos_dias: 14
