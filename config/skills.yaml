# Taxonomia de competências — VERSIONADA. Mudou padrão, conceito ou competência? Suba `versao`
# (docs/taxonomia.md tem a política e o histórico) e rode `jobradar reextrair` para o histórico
# inteiro usar a mesma versão.
#
# Campos (validados por Pydantic em transformations/skills.py):
# padroes:    regex de TERMO (nome ou sinônimo direto) sobre texto normalizado (minúsculas, sem acentos).
#             Achado = método "termo", confiança alta.
# conceitos:  regex de FRASE que implica a competência sem citá-la. Achado = método "conceito",
#             confiança média. Só entra conceito que implica a competência com pouca margem de dúvida.
# descricoes: frases-âncora da camada de embeddings local (desligada por padrão; ver `extracao`).
# tipo:       tecnica (padrão) | comportamental | idioma. Só técnica vai para gold, score e dados públicos.
# esforco:    estimativa de aprendizagem (baixo | medio | alto) — opinião configurável, não dado observado.
# projeto:    se dá para demonstrar num projeto prático de portfólio.

versao: "2.0.0"

competencias:
  # ---------------------------------------------------------------- Linguagens
  - id: python
    nome: Python
    categoria: linguagem
    padroes: ["\\bpython\\b", "\\bphyton\\b", "pandas", "pyspark", "\\bnumpy\\b", "\\bpolars\\b", "jupyter", "fastapi", "\\bdjango\\b"]
    descricoes: ["programação em Python para dados", "Python programming"]
    esforco: medio
  - id: sql
    nome: SQL
    categoria: linguagem
    padroes: ["\\bsql\\b", "t-sql", "pl/?sql", "consultas sql", "stored procedures?", "window functions?", "funcoes de janela"]
    conceitos: ["(consultas|queries) (complexas|avancadas|otimizadas)", "otimizacao de (consultas|queries)",
                "(consultas|queries),? (e )?(procedures|functions|views|triggers)", "\\bprocedures? (em|no|na|de) ",
                "bancos? de dados relaciona(l|is)", "relational databases?"]
    descricoes: ["escrever consultas em bancos de dados relacionais", "writing complex queries"]
    esforco: baixo
  - id: scala
    nome: Scala
    categoria: linguagem
    padroes: ["\\bscala\\b"]
    esforco: alto
  - id: java
    nome: Java
    categoria: linguagem
    padroes: ["\\bjava\\b(?!script)"]
    esforco: alto

  # ---------------------------------------------------------------- Processamento
  - id: spark
    nome: Apache Spark
    categoria: processamento
    padroes: ["\\bspark\\b", "pyspark", "spark sql", "sparksql"]
    descricoes: ["processamento de dados com Spark"]
    esforco: medio
