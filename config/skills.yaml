    # "analisar grandes volumes de dados" (analista) NÃO implica processamento distribuído; processar/ingerir sim.
    conceitos: ["processamento (distribuido|paralelo|massivo)", "distributed (data )?(computing|processing|systems)",
                "sistemas distribuidos",
                "(processamento|processar|ingestao|experiencia com|vivencia com|atuacao com) (de )?grandes volumes de dados",
                "large[- ]scale data (processing|pipelines|platforms?)"]
    descricoes: ["processamento distribuído de grandes volumes de dados", "big data processing at scale"]
    esforco: alto
  - id: databricks
    nome: Databricks
    categoria: plataforma
    padroes: ["databricks", "delta lake", "unity catalog"]
    esforco: medio
  - id: kafka
    nome: Kafka / Streaming
    categoria: processamento
    padroes: ["kafka", "streaming", "kinesis", "event hubs?", "rabbitmq", "pub/?sub", "flink"]
    conceitos: ["tempo real", "real[- ]time", "event[- ]driven", "orientad[ao]s? a eventos", "mensageria"]
    descricoes: ["processamento de dados em tempo real", "arquitetura orientada a eventos", "real-time data streaming"]
