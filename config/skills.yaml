# Trechos que indicam que o resto da seção é "desejável", não requisito.
marcadores_desejavel:
  - "diferencia(l|is)"
  - "desejave(l|is)"
  - "nice to have"
  - "sera um plus"
  - "e um plus"
  - "bonus"
  - "seria otimo"
  - "preferred qualifications"
# Cabeçalhos que abrem (ou voltam a) uma seção da VAGA: requisitos e responsabilidades.
# Verificados depois dos de desejável ("Requisitos desejáveis" é desejável) e antes dos de contexto.
marcadores_requisito:
  - "requisitos"
  - "obrigatori"
  - "o que (voce precisa|esperamos|procuramos|voce vai|voce fara|vai fazer)"
  - "qualificac"
  - "requirements"
  - "must have"
  - "responsabilidades"
  - "responsibilities"
  - "atribuicoes"
  - "atividades"
  - "conhecimentos"
  - "sobre (a|o|voce) ?(vaga|oportunidade|posicao|funcao|cargo|area|time|projeto|desafio|papel)?$"
  - "about (the|this) (role|job|position|team|opportunity)"
  - "descricao (da vaga|do perfil|do cargo)"
  - "what (you('ll| will) do|we('re| are) looking for|you bring)"
  - "(the|your) role"
  - "desafios"
  - "missao do cargo"
  - "qualifications"
# Cabeçalhos de seção que NÃO descrevem a vaga (empresa, benefícios, processo): não geram competência.
marcadores_contexto:
  - "^sobre (nos|a empresa|o grupo)"
  - "^sobre (a|o) [a-z0-9&' .-]+$"
  - "quem somos"
  - "^about "
  - "informacoes adicionais"
  - "beneficios"
  - "\\bbenefits\\b"
  - "o que oferecemos"
  - "what we offer"
  - "(nossa|our) cultura?e?"
  - "etapas do processo"
  - "por que (trabalhar|fazer parte|se juntar)"
  - "why (join|work)"
# Antes do primeiro cabeçalho, o texto é tratado como contexto (sobre a empresa) ATÉ uma frase
# que descreva a vaga — daí em diante conta como requisito.
frases_vaga:
  - "(estamos|estou) (em busca|buscando|procurando|contratando)"
  - "\\bbuscamos\\b"
  - "\\bprocuramos\\b"
  - "we are (looking|seeking|hiring)"
  - "you will\\b"
  - "voce (vai|ira|sera|fara|atuara)"
  - "(o|a) (profissional|pessoa) (sera|ira|vai|selecionad)"
  - "responsavel (pela|pelo|por)"
  - "(esta|this) (posicao|vaga|role|position)"
# Frases de formação acadêmica: "Graduação em Estatística" não é a competência estatística.
frases_formacao:
  - "^[-• ]*(formacao|graduacao|ensino superior|superior completo|nivel superior|bacharelado|pos[- ]graduacao|graduation|degree|bachelor)"
# Frases institucionais, em qualquer seção: também não geram competência.
frases_contexto:
  - "\\bsomos\\b"
  - "\\bacreditamos\\b"
  - "co-criamos"
  - "nossos (valores|colaboradores)"
  - "nossa (cultura|missao|historia|empresa)"
  - "\\bwe are\\b"
  - "\\bour (mission|values|culture|story)\\b"
  - "venha fazer parte"
  - "junte-se"
  - "processos? seletivos?"

# Camada semântica local (embeddings). Desligada até o conjunto-ouro mostrar ganho (docs/adr/0001).
# Nada sai da máquina: o modelo é baixado uma vez, por revisão fixa, e conferido por hash.
extracao:
  semantica:
    ativa: false
    backend: model2vec
    modelo: minishlab/potion-multilingual-128M          # licença MIT, multilíngue, estático (CPU)
    revisao: 73908c3438cf03b6a01bcb9611d62b23d0726f08   # commit fixo no Hugging Face
    sha256:                                             # conferidos com os hashes LFS publicados
      config.json: 595e4cab2093732efd5dbe084fd5c1826b5eea693b73b4c1fd971672867d2e54
      model.safetensors: 14b5eb39cb4ce5666da8ad1f3dc6be4346e9b2d601c073302fa0a31bf7943397
      tokenizer.json: 19f1909063da3cfe3bd83a782381f040dccea475f4816de11116444a73e1b6a1
    limiar: 0.65          # melhor F1 no conjunto-ouro (ADR 0001); abaixo disso os falsos positivos disparam
    limiar_media: 0.75    # a partir daqui o achado tem confiança "media"; abaixo, "baixa"
    tipos: [tecnica]
  # true = gold, score e dados públicos passam a somar os achados semânticos aceitos.
  gold_hibrida: false

# Fila de curadoria (`jobradar competencias candidatas`): termos frequentes nas vagas de dados que a
# taxonomia não cobre. Aprovar = acrescentar padrão/conceito acima; recusar = acrescentar em `ignorar`.
candidatas:
  stopwords: [de, da, do, das, dos, e, a, o, as, os, em, "no", na, nos, nas, para, com, por, um, uma, que, se, ao,
              aos, ou, sua, seu, suas, seus, como, mais, sobre, entre, nao, sao, ser, ter, the, and, of, to, in, for,
              with, "on", or, is, are, be, as, an, at, by, from, our, your, you, we, will, this, that, y, el, la, los,
              las, del, con, para, en, por, e/ou]
  # Cargos e cursos não são competências; termos recusados na curadoria entram aqui também.
  ignorar:
    - "^(analista|engenheir[oa]|cientista|arquitet[oa]|desenvolvedor[a]?|especialista|coordenador[a]?|gerente|estagiari[oa])\\b"
    - "^(engenharia|ciencia|sistemas de informacao|computacao|matematica|superior completo|ensino superior)\\b"
    - "(engineer|analyst|scientist|architect|developer|associate)s?$"
    - "^(dados|data|analytics|engineer|engenharia|business intelligence|cloud|google|microsoft|amazon|apache|plataformas?|informacoes gerais)\\b"
