# Catálogo de empresas monitoradas nos ATS (dado público e curado; decisão em docs/adr/0009).
# Validado por Pydantic em src/jobradar/empresas/catalogo.py. Só `status: ativa` entra na coleta.
#
# Campos:
# id                identificador estável (minúsculas, sem espaço)
# nome, pais        nome de exibição e país (ISO 3166-1 alfa-2)
# segmento          banco | fintech | servicos_financeiros | seguros | consultoria | tecnologia | telecom | varejo |
#                   industria | saude | educacao | energia | logistica | imobiliario | jogos | midia | governo | outro
# site              site institucional (https). Vazio = ainda não conferido
# pagina_carreiras  página de carreiras da própria empresa (https). Vazio = ainda não conferida
# ats               greenhouse | lever | ashby | smartrecruiters (com coletor) · gupy | workday | outro (sem coletor)
# board             token (Greenhouse), slug (Lever), nome do quadro (Ashby) ou companyIdentifier (SmartRecruiters)
# status            candidata (aguarda curadoria) | ativa (coletada) | pausada | descartada
# verificada_em     última conferência humana do quadro (obrigatória para ativa)
# origem            manual | descoberta
# nome_fixo         true = a coleta usa `nome` no lugar do nome que a API informa (quadro publicado por parceiro).
#                   Omitido = false: o nome vem da fonte (docs/adr/0012)
#
# A URL da API e a página do quadro no ATS são derivadas de ats + board (não repita aqui).
# A última coleta bem-sucedida é medida a cada execução (meta/board_runs): `jobradar empresas listar`.
# Para incluir uma empresa, confirme o quadro em boards.greenhouse.io/<token>, jobs.lever.co/<slug>,
# jobs.ashbyhq.com/<quadro> ou api.smartrecruiters.com/v1/companies/<id>/postings
# e anote a data em verificada_em (docs/operations.md, "Incluir uma empresa").
# Fila de curadoria: `jobradar empresas detectar URL --adicionar ...` inclui como candidata;
# `jobradar empresas aprovar ID` ativa depois de uma verificação sem pendências (docs/adr/0012).

